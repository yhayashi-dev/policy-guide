name: Publish static site to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm lint
      - name: Resolve Pages address
        id: config
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ steps.config.outputs.base_url }}
          BASE_PATH: ${{ steps.config.outputs.base_path }}
        run: pnpm build && pnpm check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
